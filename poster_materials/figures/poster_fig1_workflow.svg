   </g>
   <g id="text_6">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(227.25 131.787281)">Show every subset of the</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(227.25 148.32482)">4 records (16 subsets)</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(227.25 163.987281)">in 3 fixed orderings:</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(227.25 180.087281)">48 prompts per scenario.</text>
   </g>
