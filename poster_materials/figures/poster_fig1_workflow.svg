   </g>
   <g id="text_18">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(992.826 132.901344)">Do the cited records drive</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(992.826 148.32482)">P(d*)? Beat fraction vs</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(992.826 165.101344)">same-size alternative</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(992.826 180.52482)">sets (chance = 0.5).</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2a78d6" x="24.696" y="37.404" transform="rotate(-0 24.696 37.404)">What the model does with the evidence (steps 1–4)</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #eb6834" x="790.272" y="37.404" transform="rotate(-0 790.272 37.404)">What the model says it used (steps 5–6)</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="38.646" y="281.685656" transform="rotate(-0 38.646 281.685656)">Validation</text>
   </g>
   <g id="text_22">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="127.926" y="281.555754" transform="rotate(-0 127.926 281.555754)">Infrastructure checks I1–I9 in every scenario · recovery checks on the 3 designed controls · an independent re-implementation reproduces every saved number</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="38.646" y="331.581656" transform="rotate(-0 38.646 331.581656)">Post hoc</text>
   </g>
   <g id="text_24">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="127.926" y="331.451754" transform="rotate(-0 127.926 331.451754)">Content-only baseline: a citer that never sees the model cites the records that the design or rubric marks as supporting the decision; same metrics</text>
   </g>
