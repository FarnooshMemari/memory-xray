   <g id="text_15">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(801.432 131.787281)">“Which records did your</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(801.432 147.887281)">answer rely on?”</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(801.432 163.987281)">10 sampled + 3 greedy</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(801.432 180.087281)">replies per scenario.</text>
   </g>
