   </g>
   <g id="text_3">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(35.856 131.787281)">A question plus four</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(35.856 148.32482)">evidence records (E1–E4).</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(35.856 163.987281)">6 scenarios: 3 designed</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(35.856 180.614664)">controls, 3 realistic</text>
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(35.856 197.301344)">macro-finance cases.</text>
   </g>
